<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Client Regions Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />

  <!-- Mapbox Search JS Web (Search Box API UI for POIs) -->
  <script id="search-js" defer src="https://api.mapbox.com/search-js/v1.3.0/web.js"></script>

  <style>
    html,body,#map{height:100%;margin:0}

    .panel{
      position:absolute;top:16px;left:16px;max-width:400px;z-index:1000;
      background:#fff;border-radius:12px;padding:14px 16px;
      box-shadow:0 4px 14px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12);
      font:13px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:#1f2937; overflow:visible
    }
    .panel h3{margin:0 0 8px 0;font-size:14px;font-weight:600;letter-spacing:.3px}
    .field{margin:10px 0 6px}
    .field label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px}
    .input, select.input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;outline:none;background:#fff}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

    .btn{appearance:none;border:0;border-radius:10px;padding:8px 12px;background:#1976d2;color:#fff;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(25,118,210,.35)}
    .btn:hover{filter:brightness(1.05)}
    .btn.secondary{background:#e5e7eb;color:#111827;box-shadow:none}
    .btn.toggle.active{background:#0ea5e9;color:#fff}

    .switches{margin-top:8px}
    .switches label{display:block;margin:6px 0}

    .legend{margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .swatch{width:14px;height:14px;display:inline-block;border:1px solid #999;vertical-align:middle;margin-right:4px;border-radius:4px}

    #status{margin-top:8px;color:#374151;font-size:12px}

    .popup-copy{
      margin-left:8px;padding:2px 8px;border:1px solid #d1d5db;border-radius:8px;
      background:#f3f4f6;cursor:pointer;font-size:11px
    }
    .popup-copy:hover{background:#e5e7eb}
    .popup-copied{margin-left:6px;font-size:11px;color:#059669;display:none}

    #searchbox-wrap .mapbox-searchbox{width:100%}

    /* Centered modal */
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.25);
      display:none;align-items:center;justify-content:center;z-index:1500
    }
    .modal-box{
      background:#fff;border-radius:12px;max-width:520px;width:92%;
      box-shadow:0 10px 30px rgba(0,0,0,.25);padding:16px 18px
    }
    .modal-box h4{margin:0 0 8px 0;font-size:15px}
    .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .hidden{display:none}
  </style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h3>Client Regions</h3>

  <div class="field">
    <label>Client</label>
    <select id="cidSel" class="input">
      <option>Loading…</option>
    </select>
  </div>

  <div class="row">
    <button id="apply" class="btn">Apply</button>
    <button id="fit" class="btn">Fit to client</button>
    <button id="assignMode" class="btn toggle secondary" title="Select tract, then choose a new region">Tract Assignment Mode</button>
    <button id="addRegionMode" class="btn toggle secondary" title="Build a new region from census tracts">Add New Region</button>
    <button id="basemap" class="btn secondary" title="Toggle basemap">Basemap: Light</button>
  </div>

  <div id="searchbox-wrap" class="field">
    <label>Search places of interest</label>
  </div>

  <div class="switches">
    <h3 style="margin-top:10px">Layers</h3>
    <label><input type="checkbox" id="chkNewOutline" checked/> New regions (outline)</label>
    <label><input type="checkbox" id="chkOldOutline" checked/> Old regions (outline)</label>
    <label><input type="checkbox" id="chkTracts" /> Census tracts (outline)</label>
    <label><input type="checkbox" id="chkFills" /> Boundary Polygon</label>
    <label><input type="checkbox" id="chkSynthetic" /> Synthetic cities</label>
  </div>

  <div class="legend">
    <span class="swatch" style="background:#ff922b"></span> New outline
    <span class="swatch" style="background:#4c6ef5"></span> Old outline
    <span class="swatch" style="background:#9b1fe5"></span> Census tracts
  </div>
  <div id="status"></div>
</div>

<!-- Centered modal -->
<div id="modal" class="modal-backdrop">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
// Mapbox token
mapboxgl.accessToken = 'pk.eyJ1IjoiamF5a2luZ2hvcm4iLCJhIjoiY2tjY2gzNTBrMDQ5cTJ6bHI3MmU3OWRjdiJ9.M9_mnej57MG7QWyEhXks_Q';

// Params
const params  = new URLSearchParams(location.search);
const SRS    = params.get('srs')    || 'EPSG:900913';
const SCHEME = params.get('scheme') || 'tms';

// Basemap styles
const LIGHT_STYLE = 'mapbox://styles/mapbox/light-v11';
const SAT_STYLE   = 'mapbox://styles/mapbox/satellite-streets-v12';
let currentBase   = LIGHT_STYLE;

// GeoServer tiles
const TILE_HOST  = 'https://dev-geoserver.zartico.com/geoserver/gwc/service/tms/1.0.0';
const L_NEWREG   = 'codecsflip:regions_current';
const SL_NEWREG  = 'regions_current';
const L_OLDREG   = 'codecsflip:regions_legacy';
const SL_OLDREG  = 'regions_legacy';
const L_LABELS   = 'codecsflip:new_labels';
const SL_LABELS  = 'new_labels';
const L_TRACTS   = 'zartographer:census_tract_boundaries';
const SL_TRACTS  = 'census_tract_boundaries';
function tmsUrl(layer) { return `${TILE_HOST}/${layer}@${SRS}@pbf/{z}/{x}/{y}.pbf`; }

// WFS for full tract geometry
const WFS_BASE = 'https://dev-geoserver.zartico.com/geoserver/zartographer/ows';
function wfsUrlByGeoid(geoid){
  const u = new URL(WFS_BASE);
  const qs = new URLSearchParams({
    service: 'WFS',
    version: '2.0.0',
    request: 'GetFeature',
    typeName: 'zartographer:census_tract_boundaries',
    outputFormat: 'application/json',
    srsName: 'EPSG:4326',
    CQL_FILTER: `geoid='${geoid}'`
  });
  u.search = qs.toString();
  return u.toString();
}

// Client IDs list
const CLIENT_IDS_OWS = 'https://dev-geoserver.zartico.com/geoserver/regions_app/ows';
function clientIdsUrl(){
  const u = new URL(CLIENT_IDS_OWS);
  const qs = new URLSearchParams({
    service: 'WFS',
    version: '2.0.0',
    request: 'GetFeature',
    typeName: 'regions_app:client_ids',
    outputFormat: 'application/json',
    propertyName: 'client_id'
  });
  u.search = qs.toString();
  return u.toString();
}

// Synthetic Cities (WMTS REST, EPSG:900913, style "generic")
const SL_SYN   = 'synthetic_cities_de_view';
const SYN_TILES = [
  'https://dev-geoserver.zartico.com/geoserver/gwc/service/wmts/rest/' +
  'codecsflip:synthetic_cities_de_view/generic/EPSG:900913/EPSG:900913:{z}/{y}/{x}' +
  '?format=application%2Fvnd.mapbox-vector-tile'
];

// Colors
const COLORS = {
  newLine:    '#ff922b',
  oldLine:    '#4c6ef5',
  tractsLine: '#9b1fe5',
  newFill:    '#fde68a',
  oldFill:    '#bfdbfe',
  tractsFill: '#fecaca',
  label:      '#1f2937',
  selectFill: '#d9e0ff',
  selectLine: '#9b1fe5'
};

// State
let CLIENT_ID = null;
let tractAbort = null;
let assignmentMode = false;
let addRegionMode = false;

// Tract Assignment state
let assignState = { stage: 'idle', geoid: null, oldRegion: null };

// Add Region state
let addRegionState = { stage:'idle', regionName:'', geoids:new Set() };

// Highlight data survives style swaps
let tractHighlightData = { type:'FeatureCollection', features:[] };

// Map
const map = new mapboxgl.Map({
  container: 'map',
  style: LIGHT_STYLE,
  center: [-97, 38.5],
  zoom: 4
});

// Search Box in panel
(function mountSearchBox(){
  const script = document.getElementById('search-js');
  script.addEventListener('load', () => {
    const sb = new mapboxsearch.MapboxSearchBox();
    sb.accessToken = mapboxgl.accessToken;
    sb.mapboxgl = mapboxgl;
    sb.marker = true;
    sb.bindMap(map);
    sb.placeholder = 'coffee, museum, trailhead';
    document.getElementById('searchbox-wrap').appendChild(sb);
  });
})();

// Build sources and layers
function buildOperationalLayers(){
  // sources
  if (!map.getSource('newRegions')) map.addSource('newRegions', { type: 'vector', tiles: [tmsUrl(L_NEWREG)],  scheme: SCHEME });
  if (!map.getSource('oldRegions')) map.addSource('oldRegions', { type: 'vector', tiles: [tmsUrl(L_OLDREG)],  scheme: SCHEME });
  if (!map.getSource('labels'))     map.addSource('labels',     { type: 'vector', tiles: [tmsUrl(L_LABELS)],  scheme: SCHEME });
  if (!map.getSource('tracts'))     map.addSource('tracts',     { type: 'vector', tiles: [tmsUrl(L_TRACTS)],  scheme: SCHEME, promoteId: { [SL_TRACTS]: 'geoid' } });

  // synthetic cities source
  if (!map.getSource('syntheticCities')) {
    map.addSource('syntheticCities', {
      type: 'vector',
      tiles: SYN_TILES,
      scheme: 'xyz',
      minzoom: 0, maxzoom: 22
    });
  }

  // highlight geojson
  if (!map.getSource('tract-highlight')) {
    map.addSource('tract-highlight', { type: 'geojson', data: tractHighlightData });
  } else {
    const src = map.getSource('tract-highlight');
    if (src && src.setData) src.setData(tractHighlightData);
  }

  const addLayerIfMissing = (def) => { if (!map.getLayer(def.id)) map.addLayer(def); };

  // hit layers
  addLayerIfMissing({ id:'new-hit', type:'fill', source:'newRegions', 'source-layer':SL_NEWREG,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''], paint:{'fill-opacity':0} });
  addLayerIfMissing({ id:'old-hit', type:'fill', source:'oldRegions', 'source-layer':SL_OLDREG,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''], paint:{'fill-opacity':0} });
  addLayerIfMissing({ id:'tracts-hit', type:'fill', source:'tracts', 'source-layer':SL_TRACTS, paint:{'fill-opacity':0} });

  // subtle fills
  addLayerIfMissing({ id:'old-fill', type:'fill', source:'oldRegions', 'source-layer':SL_OLDREG,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''], layout:{ visibility: 'none' },
    paint:{ 'fill-color': COLORS.oldFill, 'fill-opacity': 0.12 } });
  addLayerIfMissing({ id:'new-fill', type:'fill', source:'newRegions', 'source-layer':SL_NEWREG,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''], layout:{ visibility: 'none' },
    paint:{ 'fill-color': COLORS.newFill, 'fill-opacity': 0.14 } });
  addLayerIfMissing({ id:'tracts-fill', type:'fill', source:'tracts', 'source-layer':SL_TRACTS,
    layout:{ visibility: 'none' }, paint:{ 'fill-color': COLORS.tractsFill, 'fill-opacity': 0.10 } });

  // outlines
  addLayerIfMissing({ id:'new-poly-outline', type:'line', source:'newRegions', 'source-layer':SL_NEWREG,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''],
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color': COLORS.newLine, 'line-width': ['interpolate',['linear'],['zoom'],4,1,10,2.8,14,4.4], 'line-opacity': 0.95 } });

  addLayerIfMissing({ id:'old-poly-outline', type:'line', source:'oldRegions', 'source-layer':SL_OLDREG,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''],
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color': COLORS.oldLine, 'line-width': ['interpolate',['linear'],['zoom'],4,0.3,10,1.0,14,1.6], 'line-opacity': 0.95 } });

  addLayerIfMissing({ id:'tracts-outline', type:'line', source:'tracts', 'source-layer':SL_TRACTS,
    layout:{ 'line-cap':'round', 'line-join':'round', 'visibility':'none' },
    paint:{ 'line-color': COLORS.tractsLine, 'line-width': ['interpolate',['linear'],['zoom'],4,0.3,10,0.9,14,1.4], 'line-opacity': 0.9 } });

  // highlight layers
  addLayerIfMissing({ id:'tracts-highlight-geo-fill', type:'fill', source:'tract-highlight',
    layout:{ visibility: 'none' }, paint:{ 'fill-color': COLORS.selectFill, 'fill-opacity': 0.35 } });
  addLayerIfMissing({ id:'tracts-highlight-geo-line', type:'line', source:'tract-highlight',
    layout:{ visibility: 'none' }, paint:{ 'line-color': COLORS.selectLine, 'line-width': 2.5 } });
  addLayerIfMissing({ id:'tracts-highlight-fill', type:'fill', source:'tracts', 'source-layer':SL_TRACTS,
    layout:{ visibility: 'none' }, paint:{ 'fill-color': COLORS.selectFill, 'fill-opacity': 0.20 } });
  addLayerIfMissing({ id:'tracts-highlight-line', type:'line', source:'tracts', 'source-layer':SL_TRACTS,
    layout:{ visibility: 'none' }, paint:{ 'line-color': COLORS.selectLine, 'line-width': 1.5, 'line-opacity': 0.7 } });

  // labels
  addLayerIfMissing({ id:'new-labels', type:'symbol', source:'labels', 'source-layer':SL_LABELS,
    filter: ['==', ['get','client_id'], CLIENT_ID ?? ''],
    layout:{ 'text-field':['get','region'], 'text-size':['interpolate',['linear'],['zoom'],5,11,12,14], 'text-allow-overlap': false, 'text-padding': 2 },
    paint:{ 'text-color': COLORS.label, 'text-halo-color': '#ffffff', 'text-halo-width': 1 } });

  // synthetic cities layer (starts hidden)
  addLayerIfMissing({
    id:'synthetic-cities-fill',
    type:'fill',
    source:'syntheticCities',
    'source-layer': SL_SYN,
    layout:{ visibility: 'none' },
    paint:{
      'fill-color': '#9ca3af',
      'fill-opacity': 0.25,
      'fill-outline-color': '#6b7280'
    }
  });

  // Synthetic Cities thick black outline
addLayerIfMissing({
  id: 'synthetic-cities-line',
  type: 'line',
  source: 'syntheticCities',
  'source-layer': SL_SYN,
  layout: { visibility: 'none', 'line-join': 'round', 'line-cap': 'round' },
  paint: {
    'line-color': '#000000',
    'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.8, 10, 2.2, 14, 3.2],
    'line-opacity': 0.95
  }
});

// Synthetic Cities labels (synthetic_city_name) with white halo
addLayerIfMissing({
  id: 'synthetic-cities-labels',
  type: 'symbol',
  source: 'syntheticCities',
  'source-layer': SL_SYN,
  layout: {
    visibility: 'none',
    'text-field': ['coalesce', ['get', 'synthetic_city_name'], ['get', 'name'], ''],
    'text-size': ['interpolate', ['linear'], ['zoom'], 5, 11, 12, 15],
    'text-allow-overlap': false,
    'text-padding': 2
  },
  paint: {
    'text-color': '#111111',
    'text-halo-color': '#ffffff',
    'text-halo-width': 1.2
  }
});


  restoreVisibilityFromUI();
}

map.on('load', buildOperationalLayers);
map.on('style.load', buildOperationalLayers);

// Click handling
map.on('click', async (e) => {
  if (addRegionMode)      await handleAddRegionClick(e);
  else if (assignmentMode)await handleAssignClick(e);
  else                    await handleNormalClick(e);
});

// UI wiring
document.getElementById('apply').onclick = () => { CLIENT_ID = getSelectedClient(); applyClientFilter(); };
document.getElementById('fit').onclick   = () => fitToClientFromTiles();
document.getElementById('assignMode').onclick = () => setAssignMode(!assignmentMode);
document.getElementById('addRegionMode').onclick = () => setAddRegionMode(!addRegionMode);
document.getElementById('basemap').onclick = () => {
  currentBase = currentBase === LIGHT_STYLE ? SAT_STYLE : LIGHT_STYLE;
  map.setStyle(currentBase);
  document.getElementById('basemap').textContent = `Basemap: ${currentBase === LIGHT_STYLE ? 'Light' : 'Satellite'}`;
  setStatus(`Basemap set to ${currentBase === LIGHT_STYLE ? 'Light' : 'Satellite'}`);
};
document.getElementById('chkNewOutline').onchange = (e) => setVis('new-poly-outline', e.target.checked);
document.getElementById('chkOldOutline').onchange = (e) => setVis('old-poly-outline', e.target.checked);
document.getElementById('chkTracts').onchange     = (e) => { setVis('tracts-outline', e.target.checked); updateFillsVisibility(); };
document.getElementById('chkFills').onchange      = () => updateFillsVisibility();
document.getElementById('chkSynthetic').onchange  = (e) => toggleSynthetic(e.target.checked);

// Load clients, apply initial filter
loadClientIds().then(() => {
  CLIENT_ID = getSelectedClient();
  applyClientFilter();
  setStatus('Client list loaded.');
}).catch(err => {
  console.error('Client IDs load failed', err);
  const fallback = params.get('client') || 'Green_Country_Tourism_OK';
  ensureClientInDropdown(fallback);
  CLIENT_ID = fallback;
  applyClientFilter();
  setStatus('Client list fallback applied.');
});

// Normal click
async function handleNormalClick(e){
  const box = [[e.point.x - 3, e.point.y - 3],[e.point.x + 3, e.point.y + 3]];
  const newFeat = map.queryRenderedFeatures(box, { layers: ['new-hit'] }).find(f => f.properties.client_id === CLIENT_ID);
  const oldFeat = map.queryRenderedFeatures(box, { layers: ['old-hit'] }).find(f => f.properties.client_id === CLIENT_ID);
  const tract   = map.queryRenderedFeatures(box, { layers: ['tracts-hit'] })[0];

  const newName = newFeat?.properties?.region || 'None';
  const oldName = oldFeat?.properties?.region || 'None';
  const geoid   = tract?.properties?.geoid || '';

  if (geoid) {
    const idStr = String(geoid);
    if (map.getLayer('tracts-highlight-fill')) {
      map.setFilter('tracts-highlight-fill', ['==', ['to-string',['id']], idStr]);
      map.setFilter('tracts-highlight-line', ['==', ['to-string',['id']], idStr]);
      map.setLayoutProperty('tracts-highlight-fill','visibility','visible');
      map.setLayoutProperty('tracts-highlight-line','visibility','visible');
    }
    await highlightFullTract(geoid);
  } else {
    clearTractHighlight();
  }

  const html = `
    <div style="font:12px system-ui;line-height:1.35">
      <div><strong>New region</strong>: ${escapeHtml(newName)}</div>
      <div><strong>Old region</strong>: ${escapeHtml(oldName)}</div>
      <div>
        <strong>Tract GEOID</strong>: <span class="geoid-val">${escapeHtml(geoid || 'None')}</span>
        ${geoid ? `<button class="popup-copy" data-copy="${escapeHtml(geoid)}" title="Copy GEOID">Copy GEOID</button>` : ``}
      </div>
    </div>`;
  const popup = new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);

  popup.getElement().querySelectorAll('.popup-copy').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const value = btn.getAttribute('data-copy') || '';
      if (!value) return;
      await copyToClipboard(value);
      flashCopied(btn);
    });
  });
}

// Tract Assignment mode click behavior
async function handleAssignClick(e){
  const box = [[e.point.x - 3, e.point.y - 3],[e.point.x + 3, e.point.y + 3]];

  if (assignState.stage === 'idle' || assignState.stage === 'awaitTract') {
    const tract = map.queryRenderedFeatures(box, { layers: ['tracts-hit'] })[0];
    const newFeat = map.queryRenderedFeatures(box, { layers: ['new-hit'] }).find(f => f.properties.client_id === CLIENT_ID);

    const geoid = tract?.properties?.geoid || '';
    const curRegion = newFeat?.properties?.region || '';

    if (!geoid || !curRegion) { setStatus('Click inside a tract and within a current region.'); return; }

    const idStr = String(geoid);
    if (map.getLayer('tracts-highlight-fill')) {
      map.setFilter('tracts-highlight-fill', ['==', ['to-string',['id']], idStr]);
      map.setFilter('tracts-highlight-line', ['==', ['to-string',['id']], idStr]);
      map.setLayoutProperty('tracts-highlight-fill','visibility','visible');
      map.setLayoutProperty('tracts-highlight-line','visibility','visible');
    }
    highlightFullTract(geoid).catch(()=>{});

    assignState = { stage: 'pickedTract', geoid, oldRegion: curRegion };

    const html = `
      <div style="font:12px system-ui;line-height:1.35">
        <div><strong>Tract GEOID</strong>: ${escapeHtml(geoid)}</div>
        <div><strong>Current region</strong>: ${escapeHtml(curRegion)}</div>
        <div style="margin-top:6px"><button class="popup-copy" id="startReassign">Reassign to another region</button></div>
      </div>`;
    const popup = new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
    const el = popup.getElement();
    const btn = el.querySelector('#startReassign');
    if (btn) {
      btn.addEventListener('click', () => {
        assignState.stage = 'awaitNewRegion';
        popup.remove();
        setStatus('Assignment: click the new region to reassign the selected tract.');
      });
    }
    return;
  }

  if (assignState.stage === 'awaitNewRegion') {
    const regionFeat = map.queryRenderedFeatures(box, { layers: ['new-hit'] }).find(f => f.properties.client_id === CLIENT_ID);
    const newRegion = regionFeat?.properties?.region || '';
    if (!newRegion) { setStatus('Not a valid region. Click inside a region to complete the reassignment.'); return; }

    const client = CLIENT_ID || '';
    const payload = `${client}\t${assignState.geoid}\t${assignState.oldRegion}\t${newRegion}`;
    await copyToClipboard(payload);

    new mapboxgl.Popup({ closeButton: true, closeOnClick: true })
      .setLngLat(e.lngLat)
      .setHTML(`<div style="font:12px system-ui">Copied:<br>${escapeHtml(payload)}</div>`)
      .addTo(map);

    setStatus(`Copied assignment: ${client} | ${assignState.geoid} | ${assignState.oldRegion} -> ${newRegion}`);
    assignState = { stage: 'awaitTract', geoid: null, oldRegion: null };
  }
}

// Add Region mode click behavior
async function handleAddRegionClick(e){
  const box = [[e.point.x - 3, e.point.y - 3],[e.point.x + 3, e.point.y + 3]];
  const tract = map.queryRenderedFeatures(box, { layers: ['tracts-hit'] })[0];
  const geoid = tract?.properties?.geoid || '';
  if (!geoid) { setStatus('Click inside a census tract.'); return; }

  if (!addRegionState.geoids.has(geoid)) {
    addRegionState.geoids.add(geoid);
    try {
      const res = await fetch(wfsUrlByGeoid(geoid));
      if (res.ok) {
        const gj = await res.json();
        appendTractHighlight(gj);
      }
    } catch(_) {}
  }
  if (!addRegionState.regionName || addRegionState.stage === 'collecting') {
    showNameModal(geoid);
  } else {
    setStatus(`Selected tracts: ${addRegionState.geoids.size} for "${addRegionState.regionName || '(unnamed)'}".`);
  }
}

function appendTractHighlight(gj){
  if (gj && gj.features && gj.features.length) {
    tractHighlightData.features.push(...gj.features);
    const src = map.getSource('tract-highlight');
    if (src) src.setData(tractHighlightData);
    map.setLayoutProperty('tracts-highlight-geo-fill', 'visibility', 'visible');
    map.setLayoutProperty('tracts-highlight-geo-line', 'visibility', 'visible');
  }
}

async function highlightFullTract(geoid){
  try {
    if (tractAbort) tractAbort.abort();
    tractAbort = new AbortController();

    setStatus(`Loading tract ${geoid} from WFS`);
    const url = wfsUrlByGeoid(geoid);
    const res = await fetch(url, { signal: tractAbort.signal });
    if (!res.ok) { setStatus(`WFS HTTP ${res.status}`); return; }
    const gj = await res.json();

    tractHighlightData = gj;
    const src = map.getSource('tract-highlight');
    if (src) src.setData(tractHighlightData);

    if (map.getLayer('tracts-highlight-geo-fill')) map.setLayoutProperty('tracts-highlight-geo-fill', 'visibility', 'visible');
    if (map.getLayer('tracts-highlight-geo-line')) map.setLayoutProperty('tracts-highlight-geo-line', 'visibility', 'visible');
    if (map.getLayer('tracts-highlight-fill'))     map.setLayoutProperty('tracts-highlight-fill',     'visibility', 'none');
    if (map.getLayer('tracts-highlight-line'))     map.setLayoutProperty('tracts-highlight-line',     'visibility', 'none');

    setStatus(`Loaded full tract ${geoid}`);
  } catch (err) {
    if (err?.name === 'AbortError') return;
    console.error('WFS error', err);
    setStatus('WFS error. See console.');
  }
}

function clearTractHighlight() {
  tractHighlightData = { type:'FeatureCollection', features:[] };
  const src = map.getSource('tract-highlight');
  if (src) src.setData(tractHighlightData);
  ['tracts-highlight-geo-fill','tracts-highlight-geo-line','tracts-highlight-fill','tracts-highlight-line'].forEach(id=>{
    if (map.getLayer(id)) map.setLayoutProperty(id,'visibility','none');
  });
}

// Modal helpers
function showModal(html){
  const box = document.getElementById('modalBox');
  box.innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}
function hideModal(){ document.getElementById('modal').style.display = 'none'; }

function showStartSelectingModal(){
  showModal(`
    <h4>Add New Region</h4>
    <div>Choose the first census tract to add a region.</div>
    <div class="modal-actions">
      <button id="okStart" class="btn">OK</button>
      <button id="cancelStart" class="btn secondary">Cancel</button>
    </div>
  `);
  document.getElementById('okStart').onclick = () => { hideModal(); addRegionState.stage = 'awaitFirst'; };
  document.getElementById('cancelStart').onclick = () => setAddRegionMode(false);
}

function showNameModal(lastGeoidClicked){
  const current = addRegionState.regionName || '';
  const listArr = Array.from(addRegionState.geoids);
  showModal(`
    <h4>Name New Region</h4>
    <div class="field">
      <label>Region name</label>
      <input id="regionNameInput" class="input" placeholder="New Region Name" value="${escapeHtml(current)}"/>
    </div>
    <div class="field">
      <label>Selected tracts (${listArr.length})</label>
      <div style="max-height:120px;overflow:auto">${listArr.map(escapeHtml).join(', ') || escapeHtml(lastGeoidClicked || '')}</div>
    </div>
    <div class="modal-actions">
      <button id="doneBtn" class="btn">Done</button>
      <button id="addMoreBtn" class="btn secondary">Add another tract</button>
      <button id="cancelBtn" class="btn secondary">Cancel</button>
    </div>
  `);

  const input = document.getElementById('regionNameInput');
  input.focus(); input.select();

  document.getElementById('cancelBtn').onclick = () => { hideModal(); };

  document.getElementById('addMoreBtn').onclick = () => {
    addRegionState.regionName = input.value.trim();
    addRegionState.stage = 'collecting';
    hideModal();
    setStatus(`Selected tracts: ${addRegionState.geoids.size} for "${addRegionState.regionName || '(unnamed)'}". Click another tract or Done.`);
  };

  document.getElementById('doneBtn').onclick = async () => {
    addRegionState.regionName = input.value.trim();
    const regionName = addRegionState.regionName;
    const client = CLIENT_ID || '';
    const list = Array.from(addRegionState.geoids).sort();

    if (!client || !regionName || list.length === 0) { setStatus('Need client, region name, and at least one tract.'); return; }

    const payload = `${client}\t${list.join(',')}\t\t${regionName}`;
    await copyToClipboard(payload);
    setStatus(`Copied: ${client} | ${list.length} tract(s) | ${regionName}`);

    hideModal();

    addRegionState = { stage:'awaitFirst', regionName:'', geoids:new Set() };
    clearTractHighlight();
    showStartSelectingModal();
  };
}

// Mode toggles
function setAddRegionMode(on){
  addRegionMode = on;
  if (addRegionMode && assignmentMode) setAssignMode(false);
  const btn = document.getElementById('addRegionMode');
  btn.classList.toggle('active', addRegionMode);
  btn.classList.toggle('secondary', !addRegionMode);
  btn.textContent = addRegionMode ? 'Add New Region (ON)' : 'Add New Region';

  if (addRegionMode) {
    setVis('new-poly-outline', true);
    setVis('old-poly-outline', true);
    setVis('tracts-outline',   true);
    const chkNew = document.getElementById('chkNewOutline'); if (chkNew) chkNew.checked = true;
    const chkOld = document.getElementById('chkOldOutline'); if (chkOld) chkOld.checked = true;
    const chkTr  = document.getElementById('chkTracts');     if (chkTr)  chkTr.checked = true;

    addRegionState = { stage:'awaitFirst', regionName:'', geoids:new Set() };
    clearTractHighlight();
    showStartSelectingModal();
    setStatus('Add New Region mode: click a tract to begin.');
  } else {
    hideModal();
    addRegionState = { stage:'idle', regionName:'', geoids:new Set() };
    clearTractHighlight();
    setStatus('Add New Region mode off.');
  }
}

function setAssignMode(on){
  assignmentMode = on;
  if (assignmentMode && addRegionMode) setAddRegionMode(false);
  const btn = document.getElementById('assignMode');
  btn.classList.toggle('active', assignmentMode);
  btn.classList.toggle('secondary', !assignmentMode);
  btn.textContent = assignmentMode ? 'Tract Assignment Mode (ON)' : 'Tract Assignment Mode';
  assignState = { stage: assignmentMode ? 'awaitTract' : 'idle', geoid: null, oldRegion: null };
  setStatus(assignmentMode ? 'Assignment mode: click a tract to begin.' : 'Assignment mode off.');
}

// Synthetic toggle: when on, only New outline is visible
function toggleSynthetic(on){
  setVis('synthetic-cities-fill', on);
  setVis('synthetic-cities-line', on);      // NEW
  setVis('synthetic-cities-labels', on);    // NEW

  if (on) {
    setVis('new-poly-outline', true);
    setVis('old-poly-outline', false);
    setVis('tracts-outline',   false);
    setVis('new-fill', false);
    setVis('old-fill', false);
    setVis('tracts-fill', false);

    const c = (id, val) => { const el = document.getElementById(id); if (el) el.checked = val; };
    c('chkNewOutline', true);
    c('chkOldOutline', false);
    c('chkTracts',     false);
    c('chkFills',      false);
  }
}


// Client list helpers
async function loadClientIds(){
  const sel = document.getElementById('cidSel');
  sel.innerHTML = `<option>Loading…</option>`;
  const res = await fetch(clientIdsUrl());
  if (!res.ok) throw new Error(`Client IDs HTTP ${res.status}`);
  const gj = await res.json();
  const vals = new Set();
  (gj.features || []).forEach(f => {
    const v = f.properties?.client_id ?? f.properties?.clientid ?? f.properties?.CLIENT_ID ?? null;
    if (v) vals.add(String(v));
  });
  const arr = Array.from(vals).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '';
  if (!arr.length) { sel.innerHTML = `<option value="">No clients</option>`; return; }
  arr.forEach(v => { const opt = document.createElement('option'); opt.value = v; opt.textContent = v; sel.appendChild(opt); });
  const qp = params.get('client');
  if (qp && arr.includes(qp)) sel.value = qp;
  sel.addEventListener('change', () => { CLIENT_ID = getSelectedClient(); applyClientFilter(); });
}
function ensureClientInDropdown(v){
  const sel = document.getElementById('cidSel');
  if (![...sel.options].some(o => o.value === v)) {
    const opt = document.createElement('option'); opt.value = v; opt.textContent = v; sel.appendChild(opt);
  }
  sel.value = v;
}
function getSelectedClient(){ return document.getElementById('cidSel').value; }

// Filters and visibility
function applyClientFilter() {
  const f = ['==', ['get', 'client_id'], CLIENT_ID || ''];
  safeSetFilter('new-hit',          f);
  safeSetFilter('old-hit',          f);
  safeSetFilter('new-fill',         f);
  safeSetFilter('old-fill',         f);
  safeSetFilter('new-poly-outline', f);
  safeSetFilter('old-poly-outline', f);
  safeSetFilter('new-labels',       f);
  setStatus(`Client set to ${CLIENT_ID || '(none)'}`);
}

function updateFillsVisibility() {
  const fillsOn = document.getElementById('chkFills').checked;
  const tractsOn = document.getElementById('chkTracts').checked;
  setVis('new-fill', fillsOn);
  setVis('old-fill', fillsOn);
  setVis('tracts-fill', fillsOn && tractsOn);
}

function restoreVisibilityFromUI(){
  setVis('new-poly-outline', document.getElementById('chkNewOutline').checked);
  setVis('old-poly-outline', document.getElementById('chkOldOutline').checked);
  setVis('tracts-outline',   document.getElementById('chkTracts').checked);
  updateFillsVisibility();
  const syn = document.getElementById('chkSynthetic');
  if (syn) toggleSynthetic(syn.checked);
}

// Fit and utilities
async function fitToClientFromTiles() {
  applyClientFilter();
  await idle();
  const layers = ['new-hit','old-hit'];
  let features = [];
  layers.forEach(id => { if (map.getLayer(id)) { try { features = features.concat(map.queryRenderedFeatures({ layers: [id] })); } catch(_) {} } });
  if (!features.length) { setStatus('No features at view. Zooming out.'); map.easeTo({ zoom: 3, duration: 0 }); await idle(); }
  if (!features.length) { setStatus('Could not compute bounds. Check client_id or data.'); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  features.forEach(f => { const g = f.geometry; extractCoords(g.coordinates, g.type).forEach(([x,y]) => { if (x<minX) minX=x; if (y<minY) minY=y; if (x>maxX) maxX=x; if (y>maxY) maxY=y; }); });
  if (isFinite(minX) && isFinite(minY) && isFinite(maxX) && isFinite(maxY)) map.fitBounds([[minX, minY],[maxX, maxY]], { padding: 30, duration: 0 });
}

function extractCoords(arr, type, out=[]) {
  if (type === 'Point') return [arr];
  if (type === 'MultiPoint' || type === 'LineString') return arr;
  if (type === 'MultiLineString' || type === 'Polygon') { arr.forEach(a => a.forEach(pt => out.push(pt))); return out; }
  if (type === 'MultiPolygon') { arr.forEach(p => p.forEach(r => r.forEach(pt => out.push(pt)))); return out; }
  try { JSON.stringify(arr, (k,v) => Array.isArray(v) && typeof v[0] === 'number' && v.length===2 ? out.push(v) : v); } catch(_) {}
  return out;
}
function safeSetFilter(id, filter) { if (map.getLayer(id)) map.setFilter(id, filter); }
function setVis(id, on) { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); }
function idle() { return new Promise(res => map.once('idle', res)); }
function setStatus(msg) { const el = document.getElementById('status'); if (el) el.textContent = msg; }
function escapeHtml(str) { return String(str).replace(/[&<>"'`=\/]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[s])); }
async function copyToClipboard(value){
  try { await navigator.clipboard.writeText(value); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = value; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }
}
function flashCopied(btn){
  let tag = btn.nextElementSibling;
  if (!tag || !tag.classList.contains('popup-copied')) {
    tag = document.createElement('span'); tag.className = 'popup-copied'; tag.textContent = 'Copied';
    btn.parentNode.insertBefore(tag, btn.nextSibling);
  }
  tag.style.display = 'inline';
  setTimeout(() => { tag.style.display = 'none'; }, 1200);
}
